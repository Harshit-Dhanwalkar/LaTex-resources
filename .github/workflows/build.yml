name: build-all

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Discover every standalone .tex root and default to LuaLaTeX
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, pathlib

          SKIP_DIRS  = {'.git', 'venv', '.venv', 'node_modules', 'gallery', 'frames', '__pycache__'}
          # skip animation and glossary fragment
          SKIP_FILES = {
              'latex_macros/Art/Florilegium/animation.tex',
              'latex_macros/Page_styles/Antique_book/glossary.tex'
          }

          ASY_RE = re.compile(r'\\usepackage(\[[^\]]*\])?\{asymptote\}|\\begin\{asy\}')
          ALPINE_PKGS  = 'python3 py3-pillow py3-pygments poppler-utils ghostscript biber'
          DEBIAN_PKGS  = 'python3 python3-pil python3-pygments poppler-utils ghostscript biber asymptote'

          projects = []
          for p in pathlib.Path('.').rglob('*.tex'):
              if any(part in SKIP_DIRS or part.startswith('.') for part in p.parts):
                  continue

              rel_path = str(p).replace('\\', '/')
              if rel_path in SKIP_FILES:
                  continue

              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              if '\\documentclass' not in text:
                  continue

              d = p.parent
              rel_dir = str(d).replace('\\', '/') if str(d) != '.' else '.'
              pid = (rel_dir.replace('/', '__') if rel_dir != '.' else 'root') + '__' + p.stem

              if ASY_RE.search(text):
                  os_name, pkgs = 'debian', DEBIAN_PKGS
              else:
                  os_name, pkgs = 'alpine', ALPINE_PKGS

              projects.append({
                  'id':   (rel_dir + '/' if rel_dir != '.' else '') + p.stem,
                  'safe': ((rel_dir + '/' if rel_dir != '.' else '') + p.stem).replace('/', '__'),
                  'dir':  rel_dir,
                  'file': p.name,
                  'out':  p.stem + '.pdf',
                  'os':   os_name,
                  'pkgs': pkgs,
              })

          seen = {pr['id']: pr for pr in projects}
          include = sorted(seen.values(), key=lambda r: r['id'])

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('matrix=' + json.dumps({'include': include}) + '\n')
              fh.write('count='  + str(len(include)) + '\n')

          print(f'Discovered {len(include)} LaTeX roots')
          PY

  # Build each project with LuaLaTeX. Failures are skipped
  build:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: build (${{ matrix.id }}, ${{ matrix.file }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile ${{ matrix.id }} (lualatex)
        id: compile
        uses: xu-cheng/latex-action@v4
        with:
          # Debian image only for Asymptote projects (needs the `asy` binary);
          # everything else stays on the default Alpine image.
          os: ${{ matrix.os }}
          working_directory: ${{ matrix.dir }}
          root_file: ${{ matrix.file }}
          latexmk_use_lualatex: true
          latexmk_shell_escape: true
          args: -file-line-error -interaction=nonstopmode
          extra_system_packages: ${{ matrix.pkgs }}

      - name: Collect PDF
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          src="${{ matrix.dir }}/${{ matrix.out }}"
          dst="out/${{ matrix.id }}.pdf"
          mkdir -p "$(dirname "$dst")"
          if [[ -f "$src" ]]; then
            cp "$src" "$dst"
          else
            newest=$(find "${{ matrix.dir }}" -maxdepth 1 -name '*.pdf' \
                       -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2- || true)
            if [[ -z "${newest:-}" ]]; then
              echo "::error::No PDF produced for ${{ matrix.id }}"
              exit 1
            fi
            cp "$newest" "$dst"
          fi
          ls -l "$dst"

      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.safe }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  # Report which projects failed, if any
  summarize:
    needs: [discover, build]
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "- Projects discovered: **${{ needs.discover.outputs.count }}**"
            echo "- Build job result: **${{ needs.build.result }}**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "=== All projects compiled successfully ===" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "=== Some projects failed ===" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | Root File |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate \
            --jq '.jobs[]
                  | select(.conclusion == "failure" and (.name | startswith("build")))
                  | .name' \
          | sed -E 's/^build \(([^,]+), ([^)]+)\)$/| \1 | \2 |/' \
          >> "$GITHUB_STEP_SUMMARY"

  # Deploy PDFs to GitHub Pages
  deploy:
    needs: [discover, build]
    if: >
      always()
      && github.ref == 'refs/heads/main'
      && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all PDF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: _site
          merge-multiple: true

      - name: Generate index.html
        shell: bash
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>LaTeX PDF Gallery</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 2rem; }
              li { margin: 0.5rem 0; }
              a { text-decoration: none; color: #0366d6; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>LaTeX PDF Gallery</h1>
            <p>Latest builds from the main branch.</p>
            <ul>
          EOF

          find _site -name '*.pdf' -type f | sort | while read -r pdf; do
            rel="${pdf#_site/}"
            echo "      <li><a href=\"$rel\">$rel</a></li>" >> _site/index.html
          done

          cat >> _site/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

